name: Deploy PicklePilot Worker

on:
  push:
    branches:
      - captain
      - interclub
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify branch target
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const branch = process.env.BRANCH;
          if (!['captain', 'interclub'].includes(branch) ||
              config.name !== `picklepilot-${branch}` ||
              config.d1_databases?.[0]?.database_name !== `picklepilot-${branch}-prod`) {
            throw new Error('Branch, Worker and D1 database do not match');
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Build Worker
        run: npm run build
      - name: Deploy existing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
